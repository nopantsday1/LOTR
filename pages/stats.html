<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="leaderboard" href="./leaderboard.html">Leaderboard</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="live" href="./live.html">Live</a>
    <a data-page="admin" href="./admin.html">Admin</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">


<section class="page" data-page="stats">
  <div class="page-header">
    <div>
      <h1>Community Stats</h1>
      <p>Aggregated statistics across all recorded matches.</p>
    </div>
  </div>

  <section id="statsOverview" class="stats-overview"></section>

  <div class="stats-grid">
    <section class="card stats-wide">
      <div class="stats-card-heading">
        <div>
          <div class="eyebrow">Activity</div>
          <h2>Games Per Day</h2>
        </div>
        <div class="range-buttons">
          <button class="btn" data-range="14">14D</button>
          <button class="btn" data-range="30">30D</button>
          <button class="btn" data-range="60">60D</button>
          <button class="btn" data-range="all">All</button>
        </div>
      </div>
      <div id="gamesPerDay"></div>
    </section>

    <section class="card">
      <div class="eyebrow">The War</div>
      <h2>Side Balance</h2>
      <div id="sideBalance"></div>
    </section>
    <section class="card">
      <div class="eyebrow">Momentum</div>
      <h2>Player Streaks</h2>
      <div id="playerStreaks"></div>
    </section>
    <section class="card">
      <div class="eyebrow">Hall of Fame</div>
      <h2>Community Records</h2>
      <div id="communityRecords"></div>
    </section>
    <section class="card">
      <div class="eyebrow">Team Selection</div>
      <h2>Stackers</h2>
      <div id="stackers"></div>
    </section>
    <section class="card">
      <div class="eyebrow">Curiosities</div>
      <h2>Fun Facts</h2>
      <div id="funStats"></div>
    </section>
  </div>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
