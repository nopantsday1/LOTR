<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="leaderboard" href="./leaderboard.html">Leaderboard</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="live" href="./live.html">Live</a>
    <a data-page="admin" href="./admin.html">Admin</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">


<section class="page" data-page="players">
  <div class="page-header">
    <div>
      <h1>Players</h1>
      <p>Compare Main Elo, position performance, and community records.</p>
    </div>
  </div>

  <section class="card toolbar search-toolbar">
    <label class="field-label" for="playersSearch">Find a player</label>
    <input
      id="playersSearch"
      type="search"
      placeholder="Player name or profile ID"
      autocomplete="off"
    >
    <span id="playersSearchMeta" class="muted small player-search-meta" aria-live="polite"></span>
  </section>

  <section class="card toolbar player-filter-toolbar">
    <label class="field-label" for="civFilter">
      Position filter
      <select id="civFilter">
        <option value="">All positions</option>
      </select>
    </label>
  </section>

  <section class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Main Elo</th>
          <th>Civ Elos (P1–P8)</th>
          <th>W</th>
          <th>L</th>
          <th>Profile ID</th>
        </tr>
      </thead>
      <tbody id="playersTable"></tbody>
    </table>
  </section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
