<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
<script type="module" src="/js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="/">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="/pages/balance.html">Balance</a>
    <a data-page="history" href="/pages/history.html">History</a>
    <a data-page="players" href="/pages/players.html">Players</a>
    <a data-page="leaderboard" href="/pages/leaderboard.html">Leaderboard</a>
    <a data-page="stats" href="/pages/stats.html">Stats</a>
    <a data-page="live" href="/pages/live.html">Live</a>
    <a data-page="admin" href="/pages/admin.html">Admin</a>
    <button id="authBtn" class="tab-button">Connexion</button>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">


<section class="page" data-page="players">
  <div class="page-header">
    <div>
      <h1>Players</h1>
      <p>Individual civ Elos shown as bars. Click a row to edit.</p>
    </div>
  </div>

  <section class="card">
    <select id="civFilter">
      <option value="">All civs</option>
    </select>
    </section>

    <section class="card">
    <h2>Elo Progress</h2>

    <div class="progress-controls">
      <select id="progressPlayerSelect">
        <option value="">Select player</option>
      </select>

      <select id="progressCivSelect">
        <option value="overall">Main Elo</option>
        <option value="p1">P1</option>
        <option value="p2">P2</option>
        <option value="p3">P3</option>
        <option value="p4">P4</option>
        <option value="p5">P5</option>
        <option value="p6">P6</option>
        <option value="p7">P7</option>
        <option value="p8">P8</option>
      </select>
    </div>

    <canvas id="eloProgressCanvas" width="1100" height="360"></canvas>
    <p id="eloProgressMeta" class="muted small"></p>
  </section>
  <section class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Main Elo</th>
          <th>Civ Elos (P1–P8)</th>
          <th>W</th>
          <th>L</th>
          <th>Profile ID</th>
        </tr>
      </thead>
      <tbody id="playersTable"></tbody>
    </table>
  </section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
