<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html">Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="predictions" href="./predictions.html">Predict</a>
    <a data-page="live" href="./live.html">Live</a>
    <a data-page="admin" href="./admin.html">Admin</a>
    <a data-page="about" href="./about.html">About</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">
  <section class="page" data-page="players">
    <div class="page-header">
      <div>
        <h1>Players</h1>
        <p>Community ranking by overall or civilization Elo, with position activity and win rates.</p>
      </div>
    </div>

    <section class="card toolbar search-toolbar">
      <label class="field-label players-search-field" for="playersSearch">
        Find a player
        <input
          id="playersSearch"
          type="search"
          placeholder="Player name or profile ID"
          autocomplete="off"
        >
      </label>
      <label class="field-label players-sort-field" for="playersCivSort">
        Sort by
        <select id="playersCivSort">
          <option value="overall">Overall Elo</option>
          <option value="p1">P1 Dol Guldur</option>
          <option value="p2">P2 Dol Guldur</option>
          <option value="p3">P3 Azog's Host</option>
          <option value="p4">P4 Goblin</option>
          <option value="p5">P5 Blue Mountains</option>
          <option value="p6">P6 Northmen</option>
          <option value="p7">P7 Elves</option>
          <option value="p8">P8 Iron Hills</option>
        </select>
      </label>
      <span id="playersSearchMeta" class="muted small player-search-meta" aria-live="polite"></span>
    </section>

    <section id="playersList" class="players-ranking"></section>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>
</html>
