<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="predictions" href="./predictions.html">Predict</a>
    <a data-page="tournaments" href="./tournaments.html">Tournaments</a>
    <a data-page="admin" href="./admin.html">Admin</a>
    <a data-page="about" href="./about.html">About</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">

<section class="page" data-page="tournaments">
  <div class="page-header">
    <div>
      <h1>Tournaments</h1>
      <p>The hall of champions and the record of every community tournament.</p>
    </div>
    <a class="btn" href="./tournament-admin.html">Manage tournaments</a>
  </div>

  <section class="card">
    <div class="eyebrow">Hall of Champions</div>
    <h2>Most Titles</h2>
    <div id="tournamentHall"><p class="muted">Loading…</p></div>
  </section>

  <section id="tournamentUpcomingSection" hidden>
    <div class="section-heading"><h2>Upcoming &amp; In Progress</h2></div>
    <div id="tournamentUpcoming" class="tournament-grid"></div>
  </section>

  <section>
    <div class="section-heading">
      <h2>Past Winners</h2>
      <span id="tournamentMeta" class="muted small"></span>
    </div>
    <div id="tournamentPast" class="tournament-grid"></div>
  </section>
</section>

</main>
<div class="toast" id="toast"></div>
</body>

</html>
