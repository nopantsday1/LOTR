<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
<script type="module" src="/js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="/">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="/pages/balance.html">Balance</a>
    <a data-page="history" href="/pages/history.html">History</a>
    <a data-page="players" href="/pages/players.html">Players</a>
    <a data-page="leaderboard" href="/pages/leaderboard.html">Leaderboard</a>
    <a data-page="stats" href="/pages/stats.html">Stats</a>
    <a data-page="live" href="/pages/live.html">Live</a>
    <a data-page="admin" href="/pages/admin.html">Admin</a>
    <button id="authBtn" class="tab-button">Connexion</button>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">


<section class="page" data-page="leaderboard">
  <div class="page-header">
    <div>
      <h1>Leaderboard</h1>
      <p>Ranked by Main Elo.</p>
    </div>
  </div>

  <section class="card">
    <h2>Community Win Rates</h2>
    <div id="communityWinRates">Loading…</div>
  </section>

  <section class="card">
    <div id="leaderboardSortButtons" class="sort-buttons"></div>
    <div id="leaderboardList"></div>
  </section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
