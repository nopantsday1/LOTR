<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/exportData.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="/">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="/pages/balance.html">Balance</a>
    <a data-page="history" href="/pages/history.html">History</a>
    <a data-page="players" href="/pages/players.html">Players</a>
    <a data-page="leaderboard" href="/pages/leaderboard.html">Leaderboard</a>
    <a data-page="stats" href="/pages/stats.html">Stats</a>
    <a data-page="live" href="/pages/live.html">Live</a>
    <a data-page="admin" href="/pages/admin.html">Admin</a>
    <button id="authBtn" class="tab-button">Connexion</button>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">

<section class="page" data-page="balance">
  <div class="page-header">
    <div>
      <h1>Team Balancer</h1>
      <p>Select 8 players — teams are balanced using main Elo, civ modifiers, experience, and preferences.</p>
    </div>
  </div>

  <section class="card">
    <div class="card-title">Select Players</div>
    <div id="selectedCount" class="muted">0 / 8 selected</div>
    <div id="playerPicker" class="player-picker"></div>
  </section>

  <section class="actions">
    <button id="balanceBtn" class="btn primary">⚖ Balance Teams</button>
    <button id="randomSplitBtn" class="btn">↻ Random Split</button>
  </section>

  <section id="balanceResult" class="teams"></section>
  <section id="topSplits" class="card"></section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
