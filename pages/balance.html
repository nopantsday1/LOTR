<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>
<script type="module" src="../js/exportData.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="predictions" href="./predictions.html">Predict</a>
    <a data-page="live" href="./live.html">Live</a>
    <a data-page="admin" href="./admin.html">Admin</a>
    <a data-page="about" href="./about.html">About</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">

<section class="page" data-page="balance">
  <div class="page-header">
    <div>
      <h1>Team Balancer</h1>
      <p>Select eight players. Teams are evaluated using Main Elo, position modifiers, experience, and preferences.</p>
    </div>
  </div>

  <section id="topSplits" class="balance-tabs"></section>
  <section id="balanceResult" class="teams"></section>

  <section class="card player-selection-card">
    <div class="selection-card-head">
      <div>
        <div class="card-title">Select Players</div>
        <div id="selectedCount" class="muted">0 / 8 selected</div>
      </div>
      <div class="actions selection-actions">
        <button id="balanceBtn" class="btn primary">Balance Teams</button>
      </div>
    </div>
    <div class="selection-search">
      <label class="field-label" for="balancePlayerSearch">Search players</label>
      <input
        id="balancePlayerSearch"
        type="search"
        placeholder="Search by name or profile ID"
        autocomplete="off"
      >
      <span id="balanceSearchMeta" class="muted small" aria-live="polite"></span>
    </div>
    <div id="playerPicker" class="player-picker"></div>
  </section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
