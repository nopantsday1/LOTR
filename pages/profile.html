<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hobbit Balancer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<script type="module" src="../js/app.js"></script>

</head>

<body>

<header class="topbar">
  <a class="brand" href="../index.html">⚔ Hobbit Balancer</a>
  <nav class="tabs">
    <a data-page="balance" href="./balance.html">Balance</a>
    <a data-page="history" href="./history.html">History</a>
    <a data-page="players" href="./players.html">Players</a>
    <a data-page="stats" href="./stats.html">Stats</a>
    <a data-page="predictions" href="./predictions.html">Predict</a>
    <a data-page="live" href="./live.html">Live</a>
    <a data-page="admin" href="./admin.html">Admin</a>
    <a data-page="about" href="./about.html">About</a>
  </nav>
  <span id="sync" class="sync"></span>
</header>

<main class="shell">


<section class="page" data-page="profile">
  <div class="page-header">
    <div>
      <h1>Player Profile</h1>
      <p>Rating breakdown, position performance, and complete match history.</p>
    </div>
  </div>

  <section id="profileContent" class="card">
    <div class="profile-header" id="profileHeader"></div>

    <div class="section-heading">
      <div>
        <div class="eyebrow">Rating Timeline</div>
        <h2>Elo Progress</h2>
      </div>
    </div>
    <div class="progress-controls">
      <label class="sr-only" for="profileCivSelect">Rating type</label>
      <select id="profileCivSelect">
        <option value="overall">Main Elo</option>
        <option value="p1">P1</option>
        <option value="p2">P2</option>
        <option value="p3">P3</option>
        <option value="p4">P4</option>
        <option value="p5">P5</option>
        <option value="p6">P6</option>
        <option value="p7">P7</option>
        <option value="p8">P8</option>
      </select>
    </div>

    <canvas id="profileEloProgressCanvas" width="1100" height="360"></canvas>
    <p id="profileEloProgressMeta" class="muted small"></p>
  </section>

  <section class="card">
    <div class="profile-history-heading">
      <div>
        <h2>Game History</h2>
        <p id="profileHistoryMeta" class="muted small"></p>
      </div>
    </div>
    <div id="profileHistoryList"></div>
  </section>
</section>


</main>
<div class="toast" id="toast"></div>
<div class="modal-root" id="modalRoot"></div>
</body>

</html>
